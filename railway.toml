# Scout cron service (Claude). Auth = CLAUDE_CODE_OAUTH_TOKEN (no volume). The heartbeat
# is a SECOND service using railway.heartbeat.toml. The Grok Build lane is a THIRD service
# using railway.grok.toml (GROK_AUTH_JSON, 06:00 UTC) — same image, does not replace this.
# NOTE: set cronSchedule + restartPolicyType in the Railway UI/API — this file did NOT
# auto-apply on first deploy here (the service came up always-on by default).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bin/run-all.sh"
cronSchedule = "0 4 * * *"
restartPolicyType = "NEVER"
