# Scout cron service. Auth = the CLAUDE_CODE_OAUTH_TOKEN variable (no volume). The heartbeat
# is a SECOND service using railway.heartbeat.toml.
# NOTE: set cronSchedule + restartPolicyType in the Railway UI/API — this file did NOT
# auto-apply on first deploy here (the service came up always-on by default).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bin/run-all.sh"
cronSchedule = "0 4 * * *"
restartPolicyType = "NEVER"
